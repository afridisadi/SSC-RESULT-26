<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSC Result 2026 — Ujangram Secondary School</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;
  --primary:#6d28d9;--primary2:#8b5cf6;--good:#15803d;--bad:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,#111827,#4c1d95);color:white;padding:34px 20px}
.wrap{max-width:1100px;margin:auto}
.brand{font-size:30px;font-weight:800}
.sub{opacity:.85;margin-top:6px}
.developer{font-size:12px;opacity:.65;margin-top:3px}

.tabs{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
.tab:hover{background:rgba(255,255,255,.18)}
.tab.active{background:white;color:var(--primary)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(0,0,0,.04)}
.num{font-size:27px;font-weight:800}
.label{color:var(--muted);font-size:13px;margin-top:4px}

.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:white;font-size:14px;outline:none}
input{flex:1;min-width:220px}
table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden}
th,td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left}
th{background:#fafafa;font-size:13px;color:var(--muted)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:700;font-size:12px;background:#ede9fe;color:#5b21b6}
.fail{background:#fee2e2;color:#b91c1c}
.groupbadge{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:600;font-size:11px;background:#eef2ff;color:#4338ca}
.empty{padding:35px;text-align:center;color:var(--muted)}
.footer{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}

@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr)}
  table{font-size:13px}
  th:nth-child(1),td:nth-child(1){display:none}
}
@media(max-width:500px){
  .grid{grid-template-columns:1fr 1fr}
  .brand{font-size:24px}
  th,td{padding:11px 8px}
  th:nth-child(2),td:nth-child(2){display:none}
}
</style>
</head>

<header class="header">

</header>

<main class="wrap">

  </section>

  <section class="card">

      <select id="sort">
        <option value="default">Default order</option>
        <option value="high">GPA: High → Low</option>
        <option value="low">GPA: Low → High</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table>

    </div>
  </section>
</main>

const tbody = document.getElementById('tbody');
const search = document.getElementById('search');
const gradeSel = document.getElementById('grade');
const genderSel = document.getElementById('gender');
const sortSel = document.getElementById('sort');
const tabs = document.querySelectorAll('.tab');

let activeGroup = "";

const numeric = s => parseFloat(s.gpa) || -1;

function currentScope(){
  return activeGroup ? students.filter(s => s.group === activeGroup) : students;
}

function render(){
  const scope = currentScope();
  let list = scope.filter(s =>
    (s.name.toLowerCase().includes(search.value.toLowerCase()) || String(s.roll||'').includes(search.value)) &&
    (!gradeSel.value || (gradeSel.value === 'F' ? s.grade.startsWith('F') : s.grade === gradeSel.value)) &&
    (!genderSel.value || s.gender === genderSel.value)
  );
  if (sortSel.value === 'high') list.sort((a,b) => numeric(b) - numeric(a));
  if (sortSel.value === 'low') list.sort((a,b) => numeric(a) - numeric(b));

  tbody.innerHTML = list.length ? list.map((s,i) => `
    <tr>
      <td>${i+1}</td>
      <td>${s.roll ?? '—'}</td>
      <td><b>${s.name}</b></td>
      <td><span class="groupbadge">${s.group}</span></td>
      <td>${s.gender ? (s.gender === 'Male' ? '♂️ Male' : '♀️ Female') : '—'}</td>
      <td>${s.gpa}</td>
      <td><span class="badge ${s.grade.startsWith('F') ? 'fail' : ''}">${s.grade}</span></td>
    </tr>`).join('') : `<tr><td colspan="7" class="empty">No student found</td></tr>`;

  document.getElementById('total').textContent = scope.length;
  document.getElementById('aPlus').textContent = scope.filter(s => s.grade === 'A+').length;
  document.getElementById('failed').textContent = scope.filter(s => s.grade.startsWith('F')).length;
  document.getElementById('passed').textContent = scope.length - scope.filter(s => s.grade.startsWith('F')).length;
}

tabs.forEach(tab => tab.addEventListener('click', () => {
  tabs.forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeGroup = tab.dataset.group;
  render();
}));

[search, gradeSel, genderSel, sortSel].forEach(x => x.addEventListener('input', render));
render();
</script>
